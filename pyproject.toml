[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-systems-demo"
version = "0.1.0"
description = "Transactional commerce ordering, inventory and outbox service"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Çağatay Kavas"}]
dependencies = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
commerce-demo = "commerce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
